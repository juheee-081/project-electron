<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>성경 한구절</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    :root{
      --bg:#fdf8f0;--surface:#ffffff;--surface2:#f8f2e6;
      --border:#e8d9c0;--border2:#d4c4a0;
      --text:#2c1f0e;--muted:#8a7258;
      --accent:#c47c2a;--accent2:#a06020;
      --green:#4a7a5a;--green2:#3a6248;
      --gold:#d4a030;--gold2:#f0c060;
    }
    body{font-family:'Segoe UI','Apple SD Gothic Neo',sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden;}
    .app{display:flex;height:100vh;}

    /* ── 사이드바 ── */
    .sidebar{width:210px;min-width:210px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:24px 14px;gap:4px;z-index:50;}
    .sidebar-logo{font-size:1rem;font-weight:800;color:var(--accent);margin-bottom:24px;padding:0 8px;letter-spacing:-.01em;}
    .sidebar-logo span{color:var(--green);}
    .nav-label{font-size:.65rem;font-weight:700;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;padding:0 8px;margin:10px 0 4px;}
    .nav-item{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:9px;cursor:pointer;transition:background .15s;user-select:none;}
    .nav-item:hover{background:var(--surface2);}
    .nav-item.active{background:rgba(196,124,42,.12);}
    .nav-checkbox{width:17px;height:17px;border:2px solid var(--border2);border-radius:4px;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s;font-size:.68rem;color:#fff;}
    .nav-item.active .nav-checkbox{border-color:var(--accent);background:var(--accent);box-shadow:0 0 8px rgba(196,124,42,.35);}
    .nav-item-label{font-size:.85rem;font-weight:600;color:var(--muted);transition:color .15s;}
    .nav-item.active .nav-item-label,.nav-item:hover .nav-item-label{color:var(--text);}
    .sidebar-bottom{margin-top:auto;padding:14px 8px 0;border-top:1px solid var(--border);font-size:.72rem;color:var(--muted);line-height:1.6;}

    /* ── 메인 ── */
    .main{flex:1;position:relative;overflow:hidden;}
    .page-view{position:absolute;inset:0;display:flex;flex-direction:column;opacity:0;transform:scale(1.02);pointer-events:none;transition:opacity .45s,transform .45s;}
    .page-view.visible{opacity:1;transform:scale(1);pointer-events:auto;}

    /* ── 랜딩 ── */
    .landing{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden;transition:opacity .5s,transform .5s;}
    .landing.hidden{opacity:0;transform:scale(.97);pointer-events:none;}

    /* 배경 자연 요소 */
    .land-bg{position:absolute;inset:0;background:linear-gradient(135deg,#fff9ee 0%,#fef0d0 40%,#e8f5e8 100%);}
    .sun{position:absolute;top:-80px;right:-80px;width:320px;height:320px;border-radius:50%;background:radial-gradient(circle,#ffe97a 0%,#ffcc44 40%,rgba(255,180,0,0) 70%);opacity:.55;}
    .sun-ray{position:absolute;top:60px;right:60px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(255,220,100,.4) 0%,rgba(255,200,50,.1) 50%,transparent 70%);animation:pulse 3s infinite;}
    @keyframes pulse{0%,100%{transform:scale(1);opacity:.6}50%{transform:scale(1.15);opacity:.3}}
    .leaf{position:absolute;border-radius:50% 0 50% 0;background:var(--green);opacity:.18;}
    .leaf1{width:120px;height:60px;bottom:60px;left:30px;transform:rotate(-20deg);}
    .leaf2{width:80px;height:40px;bottom:100px;left:100px;transform:rotate(15deg);}
    .leaf3{width:100px;height:50px;top:80px;left:60px;transform:rotate(30deg);}
    .leaf4{width:60px;height:30px;bottom:40px;right:200px;transform:rotate(-10deg);}
    .cloud{position:absolute;background:rgba(255,255,255,.7);border-radius:50px;}
    .cloud1{width:120px;height:40px;top:100px;left:80px;}
    .cloud2{width:80px;height:28px;top:140px;left:140px;}
    .cloud3{width:90px;height:32px;bottom:150px;right:100px;opacity:.5;}
    .bird{position:absolute;font-size:1.2rem;animation:fly 6s infinite linear;}
    .bird1{top:30%;left:20%;animation-delay:0s;}
    .bird2{top:25%;left:35%;animation-delay:1.5s;font-size:.9rem;}
    @keyframes fly{0%{transform:translateX(0) translateY(0)}50%{transform:translateX(10px) translateY(-8px)}100%{transform:translateX(0) translateY(0)}}

    .land-content{position:relative;text-align:center;z-index:2;padding:40px;}
    .land-badge{display:inline-flex;align-items:center;gap:8px;background:rgba(196,124,42,.1);border:1px solid rgba(196,124,42,.3);border-radius:20px;padding:6px 16px;font-size:.8rem;color:var(--accent);font-weight:600;margin-bottom:24px;}
    .land-title{font-size:clamp(2.5rem,6vw,4rem);font-weight:900;line-height:1.1;margin-bottom:16px;color:var(--text);letter-spacing:-.03em;}
    .land-title .hl{color:var(--accent);}
    .land-sub{font-size:1.05rem;color:var(--muted);line-height:1.75;margin-bottom:40px;max-width:440px;margin-left:auto;margin-right:auto;}
    .land-verse{background:rgba(255,255,255,.8);border:1px solid var(--border);border-radius:16px;padding:24px 32px;max-width:500px;margin:0 auto 36px;backdrop-filter:blur(8px);}
    .land-verse-text{font-size:1.05rem;line-height:1.8;color:var(--text);font-style:italic;margin-bottom:10px;}
    .land-verse-ref{font-size:.82rem;color:var(--accent);font-weight:700;}
    .land-cta{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;}
    .btn-land{padding:13px 28px;border-radius:12px;font-size:.92rem;font-weight:700;cursor:pointer;border:none;transition:all .2s;}
    .btn-land-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 6px 20px rgba(196,124,42,.35);}
    .btn-land-primary:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(196,124,42,.45);}
    .btn-land-outline{background:transparent;color:var(--green);border:1.5px solid rgba(74,122,90,.4);}
    .btn-land-outline:hover{background:rgba(74,122,90,.08);border-color:var(--green);transform:translateY(-2px);}

    /* ── 오늘의 말씀 ── */
    .verse-wrap{flex:1;overflow-y:auto;display:flex;align-items:center;justify-content:center;padding:40px 24px;background:linear-gradient(160deg,#fff9ee,#f0f8f0);}
    .verse-card{background:#fff;border:1px solid var(--border);border-radius:24px;padding:48px 52px;max-width:640px;width:100%;text-align:center;box-shadow:0 8px 40px rgba(196,124,42,.08);}
    .verse-date{font-size:.78rem;color:var(--muted);margin-bottom:28px;font-weight:600;letter-spacing:.05em;}
    .verse-deco{font-size:2rem;margin-bottom:16px;opacity:.6;}
    .verse-text{font-size:1.25rem;line-height:1.9;color:var(--text);font-style:italic;margin-bottom:24px;font-weight:500;}
    .verse-ref{display:inline-block;background:rgba(196,124,42,.1);color:var(--accent);font-size:.85rem;font-weight:800;padding:6px 18px;border-radius:20px;margin-bottom:32px;border:1px solid rgba(196,124,42,.2);}
    .verse-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
    .btn-verse{padding:10px 22px;border-radius:10px;font-size:.85rem;font-weight:700;cursor:pointer;border:none;transition:all .2s;}
    .btn-verse-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 4px 16px rgba(196,124,42,.3);}
    .btn-verse-primary:hover{opacity:.88;transform:translateY(-1px);}
    .btn-verse-outline{background:transparent;border:1.5px solid var(--border2);color:var(--muted);}
    .btn-verse-outline:hover{border-color:var(--accent);color:var(--accent);}
    .verse-copy-msg{font-size:.78rem;color:var(--green);margin-top:10px;height:18px;transition:opacity .3s;}

    /* ── 성경 읽기 ── */
    .bible-topbar{display:flex;align-items:center;gap:12px;padding:14px 24px;border-bottom:1px solid var(--border);background:#fff;flex-shrink:0;}
    .bible-topbar select{background:var(--surface2);border:1px solid var(--border2);border-radius:8px;padding:7px 14px;font-size:.88rem;color:var(--text);cursor:pointer;outline:none;font-family:inherit;}
    .bible-topbar select:focus{border-color:var(--accent);}
    .bible-body{flex:1;display:grid;grid-template-columns:1fr 300px;overflow:hidden;}
    .bible-text-area{overflow-y:auto;padding:32px 40px;border-right:1px solid var(--border);}
    .bible-book-title{font-size:1.4rem;font-weight:800;color:var(--accent);margin-bottom:6px;}
    .bible-chapter-sub{font-size:.82rem;color:var(--muted);margin-bottom:28px;}
    .bible-verse{display:flex;gap:12px;margin-bottom:14px;padding:10px;border-radius:8px;transition:background .15s;cursor:pointer;}
    .bible-verse:hover{background:rgba(196,124,42,.06);}
    .bible-verse.highlighted{background:rgba(212,160,48,.12);border-left:3px solid var(--gold);}
    .verse-num{font-size:.75rem;font-weight:800;color:var(--accent);min-width:20px;padding-top:3px;flex-shrink:0;}
    .verse-body{font-size:1rem;line-height:1.85;color:var(--text);}

    /* 메모 패널 */
    .memo-panel{display:flex;flex-direction:column;background:var(--surface2);padding:24px;}
    .memo-title{font-size:.88rem;font-weight:800;color:var(--text);margin-bottom:6px;display:flex;align-items:center;gap:7px;}
    .memo-sub{font-size:.74rem;color:var(--muted);margin-bottom:14px;line-height:1.5;}
    .memo-textarea{flex:1;background:#fff;border:1px solid var(--border);border-radius:10px;padding:14px;font-size:.88rem;font-family:inherit;color:var(--text);resize:none;outline:none;line-height:1.7;transition:border-color .2s;}
    .memo-textarea:focus{border-color:var(--accent);}
    .memo-textarea::placeholder{color:var(--muted);}
    .memo-save-row{display:flex;align-items:center;justify-content:space-between;margin-top:10px;}
    .memo-save-msg{font-size:.74rem;color:var(--green);}
    .btn-memo-save{background:var(--accent);color:#fff;border:none;padding:7px 16px;border-radius:8px;font-size:.8rem;font-weight:700;cursor:pointer;transition:opacity .2s;}
    .btn-memo-save:hover{opacity:.85;}
    .memo-highlight-hint{font-size:.74rem;color:var(--muted);margin-top:12px;padding:10px;background:rgba(196,124,42,.06);border-radius:8px;line-height:1.5;}

    ::-webkit-scrollbar{width:4px;} ::-webkit-scrollbar-track{background:transparent;} ::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px;}

    /* ── 구절 댓글 ── */
    /* 항상 보이는 ㄴ자 박스 — 닫힌 상태는 연하게 */
    .comment-box{margin-left:32px;border-left:2px solid rgba(212,196,160,.4);border-bottom:2px solid rgba(212,196,160,.4);border-radius:0 0 0 8px;padding:4px 10px 5px;background:transparent;transition:border-color .25s,background .25s,padding .25s;}
    .comment-box.open{border-left-color:var(--border2);border-bottom-color:var(--border2);background:rgba(196,124,42,.03);padding:8px 12px 10px;}
    /* 닫힌 상태 — 입력창 숨김 */
    .comment-box:not(.open) .comment-input-row{display:none;}
    /* 닫힌 상태 — 댓글 없으면 아무것도 표시 안함 */
    /* 닫힌 상태 — 기존 댓글은 작고 연하게 */
    .comment-box:not(.open) .comment-item{background:transparent;border:none;padding:1px 0;gap:4px;}
    .comment-box:not(.open) .comment-item-text{font-size:.71rem;color:rgba(138,114,88,.6);}
    .comment-box:not(.open) .comment-item-date,.comment-box:not(.open) .btn-comment-del{display:none;}
    /* 열린 상태 — 풀 스타일 */
    .comment-list{display:flex;flex-direction:column;gap:5px;margin-bottom:8px;}
    .comment-box.open .comment-item{display:flex;align-items:flex-start;gap:8px;background:rgba(255,255,255,.75);border:1px solid var(--border);border-radius:7px;padding:6px 10px;}
    .comment-item-text{flex:1;font-size:.78rem;color:var(--text);line-height:1.55;}
    .comment-item-date{font-size:.66rem;color:var(--muted);white-space:nowrap;flex-shrink:0;padding-top:2px;}
    .btn-comment-del{background:none;border:none;color:var(--muted);cursor:pointer;font-size:.72rem;padding:0 2px;flex-shrink:0;transition:color .15s;line-height:1.2;}
    .btn-comment-del:hover{color:#e53e3e;}
    .comment-input-row{display:flex;gap:6px;}
    .comment-input{flex:1;background:#fff;border:1px solid var(--border);border-radius:7px;padding:5px 10px;font-size:.78rem;font-family:inherit;color:var(--text);outline:none;transition:border-color .2s;}
    .comment-input:focus{border-color:var(--accent);}
    .comment-input::placeholder{color:var(--muted);}
    .btn-comment-submit{background:var(--accent);color:#fff;border:none;border-radius:7px;padding:5px 12px;font-size:.75rem;font-weight:700;cursor:pointer;white-space:nowrap;transition:opacity .2s;font-family:inherit;}
    .btn-comment-submit:hover{opacity:.85;}
    .cmt-dot{display:inline-block;width:5px;height:5px;background:var(--green);border-radius:50%;margin-left:2px;vertical-align:super;flex-shrink:0;}

    /* ── 상황별 말씀 추천 ── */
    .situation-section{margin-top:26px;padding-top:22px;border-top:1px solid var(--border);}
    .situation-title{font-size:.8rem;font-weight:700;color:var(--muted);margin-bottom:12px;letter-spacing:.03em;}
    .situation-btns{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:14px;}
    .btn-situation{padding:8px 14px;border-radius:20px;font-size:.76rem;font-weight:600;cursor:pointer;border:1.5px solid var(--border2);background:transparent;color:var(--muted);font-family:inherit;transition:all .2s;line-height:1.4;}
    .btn-situation:hover,.btn-situation.active{border-color:var(--accent);color:var(--accent);background:rgba(196,124,42,.08);}
    .situation-result{background:linear-gradient(135deg,rgba(196,124,42,.07),rgba(74,122,90,.06));border:1px solid var(--border);border-radius:14px;padding:20px 24px;text-align:center;animation:sitFadeIn .35s ease;}
    @keyframes sitFadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    .situation-verse-text{font-size:.97rem;line-height:1.85;color:var(--text);font-style:italic;margin-bottom:10px;}
    .situation-verse-ref{font-size:.8rem;color:var(--accent);font-weight:800;}

    /* ── 묵상 일기 ── */
    .diary-wrap{flex:1;display:flex;flex-direction:column;overflow:hidden;}
    .diary-topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 28px;border-bottom:1px solid var(--border);background:#fff;flex-shrink:0;}
    .diary-topbar-title{font-size:.95rem;font-weight:800;color:var(--accent);}
    .diary-topbar-right{display:flex;align-items:center;gap:14px;}
    .diary-counter{font-size:.8rem;color:var(--muted);font-weight:600;}
    .btn-diary-add{background:linear-gradient(135deg,var(--green),var(--green2));color:#fff;border:none;border-radius:10px;padding:8px 18px;font-size:.82rem;font-weight:700;cursor:pointer;font-family:inherit;transition:opacity .2s;box-shadow:0 3px 12px rgba(74,122,90,.25);}
    .btn-diary-add:hover{opacity:.85;}
    .diary-scene-wrap{flex:1;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;background:linear-gradient(160deg,#fff9ee 0%,#f5ede0 100%);}
    .diary-scene{width:100%;height:100%;position:relative;perspective:1100px;display:flex;align-items:center;justify-content:center;}
    .diary-nav-arrow{position:absolute;top:50%;transform:translateY(-50%);z-index:20;background:rgba(255,255,255,.92);border:1px solid var(--border);border-radius:50%;width:42px;height:42px;font-size:1.05rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;box-shadow:0 2px 12px rgba(0,0,0,.08);color:var(--accent);}
    .diary-nav-arrow:hover{background:#fff;box-shadow:0 4px 18px rgba(0,0,0,.14);transform:translateY(-50%) scale(1.08);}
    .diary-nav-arrow.left{left:18px;} .diary-nav-arrow.right{right:18px;}
    .diary-empty{text-align:center;color:var(--muted);padding:40px 20px;}
    .diary-empty-icon{font-size:3.5rem;margin-bottom:16px;}
    .diary-empty p{font-size:.95rem;margin-bottom:24px;line-height:1.75;}
    .diary-card{position:absolute;width:460px;max-width:calc(100vw - 160px);background:#fff;border:1px solid var(--border);border-radius:20px;padding:26px 28px 20px;box-shadow:0 8px 36px rgba(0,0,0,.1);transition:transform .5s cubic-bezier(.34,1.05,.64,1),opacity .4s;will-change:transform;user-select:none;}
    .diary-card.active{user-select:auto;box-shadow:0 12px 48px rgba(196,124,42,.15);}
    .diary-card-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
    .diary-card-num{font-size:.76rem;font-weight:800;color:var(--accent);background:rgba(196,124,42,.1);border:1px solid rgba(196,124,42,.2);border-radius:20px;padding:3px 12px;}
    .btn-diary-del{background:none;border:1px solid var(--border);border-radius:8px;color:var(--muted);cursor:pointer;font-size:.75rem;padding:4px 10px;transition:all .2s;font-family:inherit;}
    .btn-diary-del:hover{border-color:#e53e3e;color:#e53e3e;}
    .diary-field{margin-bottom:12px;}
    .diary-field-label{font-size:.72rem;font-weight:700;color:var(--muted);margin-bottom:5px;display:block;letter-spacing:.02em;}
    .diary-input{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:7px 12px;font-size:.88rem;color:var(--text);font-family:inherit;outline:none;width:100%;transition:border-color .2s;}
    .diary-input:focus{border-color:var(--accent);background:#fff;}
    .diary-input::placeholder{color:var(--muted);}
    .diary-textarea{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-size:.86rem;color:var(--text);font-family:inherit;outline:none;width:100%;resize:none;height:118px;line-height:1.72;transition:border-color .2s;}
    .diary-textarea:focus{border-color:var(--accent);background:#fff;}
    .diary-textarea::placeholder{color:var(--muted);}
    .diary-save-row{display:flex;align-items:center;justify-content:space-between;margin-top:10px;}
    .diary-autosave-msg{font-size:.72rem;color:var(--green);}
    .btn-diary-save{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:7px 18px;font-size:.8rem;font-weight:700;cursor:pointer;font-family:inherit;transition:opacity .2s;}
    .btn-diary-save:hover{opacity:.85;}
  </style>
</head>
<body>
<div class="app">

  <!-- 사이드바 -->
  <nav class="sidebar">
    <div class="sidebar-logo">✝ 성경 <span>한구절</span></div>
    <div class="nav-label">메뉴</div>
    <div class="nav-item active" id="nav-home" onclick="showPage('home')">
      <div class="nav-checkbox" id="chk-home">✓</div>
      <span>🏠</span><span class="nav-item-label">홈</span>
    </div>
    <div class="nav-item" id="nav-verse" onclick="showPage('verse')">
      <div class="nav-checkbox" id="chk-verse"></div>
      <span>✨</span><span class="nav-item-label">오늘의 말씀</span>
    </div>
    <div class="nav-item" id="nav-bible" onclick="showPage('bible')">
      <div class="nav-checkbox" id="chk-bible"></div>
      <span>📖</span><span class="nav-item-label">성경 읽기</span>
    </div>
    <div class="nav-item" id="nav-diary" onclick="showPage('diary')">
      <div class="nav-checkbox" id="chk-diary"></div>
      <span>📓</span><span class="nav-item-label">묵상 일기</span>
    </div>
    <div class="sidebar-bottom">
      개역개정 성경<br/>말씀으로 하루를 시작하세요 🌿
    </div>
  </nav>

  <!-- 메인 -->
  <div class="main">

    <!-- 랜딩 -->
    <div class="landing" id="landingPage">
      <div class="land-bg"></div>
      <div class="sun"></div><div class="sun-ray"></div>
      <div class="leaf leaf1"></div><div class="leaf leaf2"></div><div class="leaf leaf3"></div><div class="leaf leaf4"></div>
      <div class="cloud cloud1"></div><div class="cloud cloud2"></div><div class="cloud cloud3"></div>
      <div class="bird bird1">🕊️</div><div class="bird bird2">🕊️</div>
      <div class="land-content">
        <div class="land-badge">🌿 매일 말씀과 함께하는 하루</div>
        <h1 class="land-title"><span class="hl">성경</span> 한구절</h1>
        <p class="land-sub">오늘도 하나님의 말씀으로<br/>하루를 시작해보세요.</p>
        <div class="land-verse" id="landVerse">
          <div class="land-verse-text" id="landVerseText"></div>
          <div class="land-verse-ref" id="landVerseRef"></div>
        </div>
        <div class="land-cta">

function showSituationVerse(category, btn){
  document.querySelectorAll('.btn-situation').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  const verses = SITUATION_VERSES[category];
  const v = verses[Math.floor(Math.random()*verses.length)];
  const result = document.getElementById('situationResult');
  result.style.display = 'none';
  requestAnimationFrame(()=>{
    document.getElementById('situationText').textContent = `"${v.text}"`;

// ── 상태 ──────────────────────────────────
let currentVerse = null;
let currentPassage = '창세기 1장';
let highlighted = new Set();

// ── 페이지 전환 ───────────────────────────
function showPage(page){
  ['home','verse','bible','diary'].forEach(p=>{
    const item=document.getElementById(`nav-${p}`);
    const chk=document.getElementById(`chk-${p}`);
    if(!item||!chk)return;
    item.classList.toggle('active',p===page);
    chk.textContent=p===page?'✓':'';
  });
  document.getElementById('landingPage').classList.toggle('hidden',page!=='home');
  ['verse','bible','diary'].forEach(v=>{
    document.getElementById(`${v}View`).classList.toggle('visible',v===page);
  });
  if(page==='verse') renderTodayVerse();
  if(page==='bible') loadPassage();
  if(page==='diary'){ loadDiary(); renderDiary(); }
}

// ── 오늘의 말씀 ───────────────────────────
function getTodayVerse(){
  const today = new Date();
  const idx = today.getFullYear()*1000 + today.getMonth()*31 + today.getDate();
  return DAILY_VERSES[idx % DAILY_VERSES.length];
}

function renderTodayVerse(){
  const v = currentVerse || getTodayVerse();
  currentVerse = v;
  document.getElementById('verseText').textContent = v.text;
  document.getElementById('verseRef').textContent = v.ref;
  const today = new Date();
  document.getElementById('verseDate').textContent =
    today.toLocaleDateString('ko-KR',{year:'numeric',month:'long',day:'numeric',weekday:'long'}) + ' 의 말씀';
}

function randomVerse(){
  const prev = currentVerse;
  let next;
  do { next = DAILY_VERSES[Math.floor(Math.random()*DAILY_VERSES.length)]; }
  while(next === prev && DAILY_VERSES.length > 1);
  currentVerse = next;
  const el = document.getElementById('verseText');
  el.style.opacity = '0';
  setTimeout(()=>{
    document.getElementById('verseText').textContent = next.text;
    document.getElementById('verseRef').textContent = next.ref;
    el.style.transition = 'opacity .4s';
    el.style.opacity = '1';
  }, 250);
}

function copyVerse(){
  if(!currentVerse) return;
  const txt = `"${currentVerse.text}" — ${currentVerse.ref}`;
  navigator.clipboard.writeText(txt).then(()=>{
    const msg = document.getElementById('verseCopyMsg');
    msg.textContent = '✓ 클립보드에 복사되었습니다!';
    setTimeout(()=> msg.textContent='', 2000);
  });
}

// ── 성경 읽기 ─────────────────────────────
function loadPassage(){
  const sel = document.getElementById('bibleSelect').value;
  currentPassage = sel;
  highlighted = new Set(JSON.parse(localStorage.getItem(`hl_${sel}`) || '[]'));
  const data = BIBLE_DATA[sel];
  if(!data) return;

  const area = document.getElementById('bibleTextArea');
  area.innerHTML = `
    <div class="bible-book-title">${data.title}</div>
    <div class="bible-chapter-sub">${data.sub}</div>
    ${data.verses.map(v=>{
      const hlClass = highlighted.has(v.v) ? ' highlighted' : '';
      const hasCmt = JSON.parse(localStorage.getItem(`comments_${sel}_${v.v}`) || '[]').length > 0;
      return `
        <div class="bible-verse${hlClass}" id="bv-${v.v}">
          <span class="verse-num" onclick="toggleHighlight(${v.v})" title="클릭: 하이라이트">${v.v}${hasCmt ? '<span class="cmt-dot"></span>' : ''}</span>
          <span class="verse-body" onclick="toggleCommentBox(${v.v})" title="클릭: 감상 남기기">${v.t}</span>
        </div>
        <div class="comment-box" id="cb-${v.v}">
          <div class="comment-list" id="cl-${v.v}"></div>
          <div class="comment-input-row">
            <input class="comment-input" id="ci-${v.v}" placeholder="이 말씀에서 느낀 점을 남겨보세요..." onkeydown="if(event.key==='Enter')addComment(${v.v})"/>
            <button class="btn-comment-submit" onclick="addComment(${v.v})">저장</button>
          </div>
        </div>`;
    }).join('')}`;

  document.getElementById('memoArea').value = localStorage.getItem(`memo_${sel}`) || '';
  document.getElementById('memoSub').textContent = `${data.title} 묵상 메모`;
  document.getElementById('memoSaveMsg').textContent = '';
  // 모든 구절 댓글 초기 렌더링 (닫힌 상태에서도 연하게 보이게)
  data.verses.forEach(v => renderComments(v.v));
}

function toggleHighlight(vNum){
  if(highlighted.has(vNum)) highlighted.delete(vNum);
  else highlighted.add(vNum);
  const el = document.getElementById(`bv-${vNum}`);
  if(el) el.classList.toggle('highlighted', highlighted.has(vNum));
  localStorage.setItem(`hl_${currentPassage}`, JSON.stringify([...highlighted]));
}

// ── 구절 댓글 ─────────────────────────────
function toggleCommentBox(vNum){
  const cb = document.getElementById(`cb-${vNum}`);
  if(!cb) return;
  const isOpen = cb.classList.toggle('open');
  if(isOpen){
    setTimeout(()=>{ const inp=document.getElementById(`ci-${vNum}`); if(inp) inp.focus(); }, 60);
  }
}

function renderComments(vNum){
  const key = `comments_${currentPassage}_${vNum}`;
  const comments = JSON.parse(localStorage.getItem(key) || '[]');
  const cl = document.getElementById(`cl-${vNum}`);
  if(!cl) return;
  cl.innerHTML = comments.map((c,i)=>`
    <div class="comment-item">
      <div class="comment-item-text">${escHtml(c.text)}</div>
      <span class="comment-item-date">${c.date}</span>
      <button class="btn-comment-del" onclick="deleteComment(${vNum},${i})" title="삭제">✕</button>
    </div>`).join('');
}

function addComment(vNum){
  const input = document.getElementById(`ci-${vNum}`);
  if(!input) return;
  const text = input.value.trim();
  if(!text) return;
  const key = `comments_${currentPassage}_${vNum}`;
  const comments = JSON.parse(localStorage.getItem(key) || '[]');
  const now = new Date();
  const date = `${now.getMonth()+1}/${now.getDate()} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
  comments.push({text, date});
  localStorage.setItem(key, JSON.stringify(comments));
  input.value = '';
  renderComments(vNum);
  updateCmtDot(vNum, comments.length);
}

function deleteComment(vNum, idx){
  const key = `comments_${currentPassage}_${vNum}`;
  const comments = JSON.parse(localStorage.getItem(key) || '[]');
  comments.splice(idx, 1);
  localStorage.setItem(key, JSON.stringify(comments));
  renderComments(vNum);
  updateCmtDot(vNum, comments.length);
}

function updateCmtDot(vNum, count){
  const numEl = document.querySelector(`#bv-${vNum} .verse-num`);
  if(!numEl) return;
  const existing = numEl.querySelector('.cmt-dot');
  if(count > 0 && !existing){
    const dot = document.createElement('span');
    dot.className = 'cmt-dot';
    numEl.appendChild(dot);
  } else if(count === 0 && existing){
    existing.remove();
  }
}

function escHtml(str){
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function saveMemo(){
  const val = document.getElementById('memoArea').value;
  localStorage.setItem(`memo_${currentPassage}`, val);
  const msg = document.getElementById('memoSaveMsg');
  msg.textContent = '✓ 저장되었습니다';
  setTimeout(()=> msg.textContent='', 2000);
}

// 자동 저장 (3초 딜레이)
let memoTimer;
document.getElementById('memoArea').addEventListener('input', ()=>{
  clearTimeout(memoTimer);
  memoTimer = setTimeout(saveMemo, 3000);
});

// ── 묵상 일기 ─────────────────────────────
let diaryCards = [];
let currentDiaryIdx = 0;
const DIARY_KEY = 'meditation_diary';

function loadDiary(){
  diaryCards = JSON.parse(localStorage.getItem(DIARY_KEY) || '[]');
}

function persistDiary(){
  localStorage.setItem(DIARY_KEY, JSON.stringify(diaryCards));
}

function syncActiveCardFromDOM(){
  if(!diaryCards.length) return;
  const card = diaryCards[currentDiaryIdx];
  if(!card) return;
  const root = document.querySelector(`[data-diary-id="${card.id}"]`);
  if(!root) return;
  const dateEl = root.querySelector('input[type="date"]');
  const passEl = root.querySelector('input[type="text"]');
  const contEl = root.querySelector('.diary-textarea');
  if(dateEl) card.date = dateEl.value;
  if(passEl) card.passage = passEl.value;
  if(contEl) card.content = contEl.value;
}

function renderDiary(){
  const scene = document.getElementById('diaryScene');
  const counter = document.getElementById('diaryCounter');
  const lArr = document.querySelector('.diary-nav-arrow.left');
  const rArr = document.querySelector('.diary-nav-arrow.right');
  if(!scene) return;

  if(diaryCards.length === 0){
    scene.innerHTML = `
      <div class="diary-empty">
        <div class="diary-empty-icon">📓</div>
        <p>아직 묵상 기록이 없어요.<br/>첫 번째 말씀 묵상을 시작해보세요!</p>
        <button class="btn-diary-add" style="font-size:.9rem;padding:10px 24px;" onclick="addDiaryCard()">✦ 첫 묵상 카드 만들기</button>
      </div>`;
    if(counter) counter.textContent = '';
    if(lArr) lArr.style.visibility='hidden';
    if(rArr) rArr.style.visibility='hidden';
    return;
  }

  if(counter) counter.textContent = `${currentDiaryIdx+1} / ${diaryCards.length}`;
  if(lArr) lArr.style.visibility='visible';
  if(rArr) rArr.style.visibility='visible';

  const SPREAD=360, DEPTH=175, ROT=38;
  scene.innerHTML = diaryCards.map((card, i)=>{
    const off = i - currentDiaryIdx;
    const tx = off * SPREAD;
    const tz = off===0 ? 0 : -DEPTH;
    const ry = Math.max(-ROT, Math.min(ROT, off*ROT));
    const sc = off===0 ? 1 : Math.max(0.78, 1-Math.abs(off)*0.11);
    const op = Math.abs(off)>2 ? 0 : Math.max(0, 1-Math.abs(off)*0.32);
    const zIdx = diaryCards.length - Math.abs(off);
    const isActive = off===0;
    const navAttr = !isActive ? `onclick="moveDiary(${off>0?1:-1})" style="cursor:pointer;"` : '';
    return `<div class="diary-card${isActive?' active':''}" data-diary-id="${card.id}"
        style="transform:translateX(${tx}px) translateZ(${tz}px) rotateY(${ry}deg) scale(${sc});opacity:${op};z-index:${zIdx};" ${navAttr}>
      <div class="diary-card-top">
        <span class="diary-card-num">묵상 ${i+1}</span>
        <button class="btn-diary-del" onclick="event.stopPropagation();deleteDiaryCard(${card.id})">삭제</button>
      </div>
      <div class="diary-field">
        <label class="diary-field-label">📅 날짜</label>
        <input type="date" class="diary-input" value="${card.date}"/>
      </div>
      <div class="diary-field">
        <label class="diary-field-label">📖 읽은 말씀</label>
        <input type="text" class="diary-input" value="${escHtml(card.passage)}" placeholder="예) 시편 23편, 요한복음 3:16"/>
      </div>
      <div class="diary-field">
        <label class="diary-field-label">✏️ 묵상 내용</label>
        <textarea class="diary-textarea" placeholder="오늘 말씀을 통해 느낀 점, 기도 제목, 적용할 점을 자유롭게 적어보세요...">${escHtml(card.content)}</textarea>
      </div>
      <div class="diary-save-row">
        <span class="diary-autosave-msg" id="dsm-${card.id}"></span>
        <button class="btn-diary-save" onclick="event.stopPropagation();saveDiaryCard(${card.id})">저장</button>
      </div>
    </div>`;
  }).join('');
}

function moveDiary(dir){
  syncActiveCardFromDOM();
  persistDiary();
  const newIdx = currentDiaryIdx + dir;
  if(newIdx < 0 || newIdx >= diaryCards.length) return;
  currentDiaryIdx = newIdx;
  renderDiary();
}

function addDiaryCard(){
  syncActiveCardFromDOM();
  const today = new Date().toISOString().split('T')[0];
  diaryCards.push({id:Date.now(), date:today, passage:'', content:''});
  currentDiaryIdx = diaryCards.length - 1;
  persistDiary();
  renderDiary();
}

function deleteDiaryCard(id){
  if(!confirm('이 묵상 카드를 삭제할까요?')) return;
  diaryCards = diaryCards.filter(c=>c.id!==id);
  if(currentDiaryIdx >= diaryCards.length) currentDiaryIdx = Math.max(0, diaryCards.length-1);
  persistDiary();
  renderDiary();
}

function saveDiaryCard(id){
  syncActiveCardFromDOM();
  persistDiary();
  const msg = document.getElementById(`dsm-${id}`);
  if(msg){ msg.textContent='✓ 저장됨'; setTimeout(()=>{ if(msg) msg.textContent=''; }, 2000); }
}

// ── 랜딩 말씀 세팅 ───────────────────────
function initLanding(){
  const v = getTodayVerse();
  document.getElementById('landVerseText').textContent = `"${v.text}"`;
  document.getElementById('landVerseRef').textContent = `— ${v.ref}`;
}

// ── 초기화 ────────────────────────────────
initLanding();
showPage('home');
</script>
