<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>로또 번호 추첨기</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', 'Apple SD Gothic Neo', sans-serif;
      background: #0f0f13;
      color: #e8e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    h1 {
      font-size: 2.2rem;
      font-weight: 800;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #facc15, #f97316);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      color: #6b6b88;
      font-size: 0.95rem;
      margin-bottom: 48px;
    }

    /* 번호 공 */
    .balls {
      display: flex;
      gap: 14px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 40px;
      min-height: 80px;
      align-items: center;
    }

    .ball {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      font-weight: 800;
      color: #fff;
      opacity: 0;
      transform: scale(0) rotate(-180deg);
      transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1),
                  opacity 0.4s ease;
      box-shadow: 0 6px 20px rgba(0,0,0,0.4);
      position: relative;
    }

    .ball.show {
      opacity: 1;
      transform: scale(1) rotate(0deg);
    }

    /* 번호대별 색상 (한국 로또 기준) */
    .ball.c1  { background: radial-gradient(circle at 35% 35%, #ffee58, #f9a825); } /* 1~10  노랑 */
    .ball.c2  { background: radial-gradient(circle at 35% 35%, #66bb6a, #2e7d32); } /* 11~20 초록 */
    .ball.c3  { background: radial-gradient(circle at 35% 35%, #ef5350, #b71c1c); } /* 21~30 빨강 */
    .ball.c4  { background: radial-gradient(circle at 35% 35%, #7e57c2, #4527a0); } /* 31~40 보라 */
    .ball.c5  { background: radial-gradient(circle at 35% 35%, #78909c, #37474f); } /* 41~45 회색 */

    /* 반짝이 효과 */
    .ball::after {
      content: '';
      position: absolute;
      top: 14%;
      left: 20%;
      width: 30%;
      height: 20%;
      background: rgba(255,255,255,0.45);
      border-radius: 50%;
      filter: blur(2px);
    }

    /* 버튼 */
    .btn-draw {
      background: linear-gradient(135deg, #f59e0b, #ef4444);
      color: #fff;
      border: none;
      padding: 16px 48px;
      border-radius: 50px;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 6px 24px rgba(245, 158, 11, 0.4);
      transition: transform 0.2s, box-shadow 0.2s;
      letter-spacing: 0.05em;
    }

    .btn-draw:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 32px rgba(245, 158, 11, 0.55);
    }

    .btn-draw:active {
      transform: scale(0.97);
    }

    .btn-draw:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    /* 추첨 횟수 선택 */
    .round-control {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 36px;
      background: #16161f;
      border: 1px solid #2a2a3e;
      border-radius: 50px;
      padding: 10px 24px;
    }

    .round-control label {
      color: #9090a8;
      font-size: 0.9rem;
    }

    .round-control select {
      background: #1e1e30;
      border: 1px solid #3a3a5e;
      color: #e8e8f0;
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 0.9rem;
      cursor: pointer;
      outline: none;
    }

    /* 여러 회차 결과 */
    .results {
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 40px;
    }

    .result-row {
      background: #16161f;
      border: 1px solid #1e1e2e;
      border-radius: 16px;
      padding: 18px 24px;
      display: flex;
      align-items: center;
      gap: 10px;
      opacity: 0;
      transform: translateY(12px);
      transition: opacity 0.4s ease, transform 0.4s ease;
    }

    .result-row.show {
      opacity: 1;
      transform: translateY(0);
    }

    .result-row .round-label {
      font-size: 0.8rem;
      color: #6b6b88;
      min-width: 36px;
    }

    .mini-ball {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      font-weight: 700;
      color: #fff;
      box-shadow: 0 3px 10px rgba(0,0,0,0.3);
      position: relative;
    }

    .mini-ball::after {
      content: '';
      position: absolute;
      top: 16%;
      left: 20%;
      width: 28%;
      height: 18%;
      background: rgba(255,255,255,0.4);
      border-radius: 50%;
      filter: blur(1px);
    }

    /* 푸터 */
    footer {
      margin-top: 20px;
      color: #3a3a58;
      font-size: 0.8rem;
    }
  </style>
</head>
<body>

  <h1>🎱 로또 번호 추첨기</h1>
  <p class="subtitle">행운의 번호 6개를 뽑아드립니다!</p>

  <!-- 추첨 개수 선택 -->
  <div class="round-control">
    <label>추첨 게임 수</label>
    <select id="roundSelect">
      <option value="1">1게임</option>
      <option value="2">2게임</option>
      <option value="3">3게임</option>
      <option value="4">4게임</option>
      <option value="5" selected>5게임</option>
    </select>
  </div>

  <!-- 메인 번호 공 (1게임 강조) -->
  <div class="balls" id="mainBalls">
    <span style="color:#3a3a58; font-size:1rem;">버튼을 눌러 번호를 추첨하세요</span>
  </div>

  <button class="btn-draw" id="drawBtn" onclick="draw()">번호 추첨하기</button>

  <!-- 여러 게임 결과 -->
  <div class="results" id="results"></div>

  <footer>※ 이 앱은 재미용입니다. 당첨을 보장하지 않습니다.</footer>

  <script>
    function getColor(n) {
      if (n <= 10) return 'c1';
      if (n <= 20) return 'c2';
      if (n <= 30) return 'c3';
      if (n <= 40) return 'c4';
      return 'c5';
    }

    function pickNumbers() {
      const pool = Array.from({ length: 45 }, (_, i) => i + 1);
      const picked = [];
      while (picked.length < 6) {
        const idx = Math.floor(Math.random() * pool.length);
        picked.push(pool.splice(idx, 1)[0]);
      }
      return picked.sort((a, b) => a - b);
    }

    function draw() {
      const btn = document.getElementById('drawBtn');
      const mainBalls = document.getElementById('mainBalls');
      const results = document.getElementById('results');
      const count = parseInt(document.getElementById('roundSelect').value);

      btn.disabled = true;
      mainBalls.innerHTML = '';
      results.innerHTML = '';

      const allGames = Array.from({ length: count }, pickNumbers);

      // 첫 게임을 메인 공으로 크게 표시
      const firstGame = allGames[0];
      firstGame.forEach((num, i) => {
        const ball = document.createElement('div');
        ball.className = `ball ${getColor(num)}`;
        ball.textContent = num;
        mainBalls.appendChild(ball);
        setTimeout(() => ball.classList.add('show'), i * 180 + 100);
      });

      // 전체 게임 결과 리스트
      allGames.forEach((game, gi) => {
        const row = document.createElement('div');
        row.className = 'result-row';
        row.innerHTML = `<span class="round-label">${gi + 1}게임</span>`;
        game.forEach(num => {
          const mb = document.createElement('div');
          mb.className = `mini-ball ${getColor(num)}`;
          mb.textContent = num;
          row.appendChild(mb);
        });
        results.appendChild(row);
        setTimeout(() => row.classList.add('show'), gi * 120 + 300);
      });

      const totalDelay = 6 * 180 + count * 120 + 600;
      setTimeout(() => { btn.disabled = false; }, totalDelay);
    }
  </script>

</body>
</html>
