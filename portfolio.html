<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>1학년 맞춤 포트폴리오 제작소</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0a0a0f; --surface: #13131a; --surface2: #1a1a25;
      --border: #1e1e2e; --border2: #2a2a3e;
      --text: #e8e8f0; --muted: #6b6b88;
      --accent: #a78bfa; --accent2: #7c3aed;
      --green: #34d399; --yellow: #fbbf24; --red: #f87171;
      --blue: #60a5fa; --orange: #fb923c;
      --shadow: rgba(0,0,0,0.4);
    }
    body.light {
      --bg: #f4f4fc; --surface: #ffffff; --surface2: #ebebf8;
      --border: #e0e0f0; --border2: #cecee8;
      --text: #1a1a2e; --muted: #7878a0;
      --accent: #7c3aed; --accent2: #6d28d9;
      --shadow: rgba(100,80,200,0.08);
    }
    body { font-family:'Segoe UI','Apple SD Gothic Neo',sans-serif; background:var(--bg); color:var(--text); height:100vh; overflow:hidden; transition:background .3s,color .3s; }

    /* ── 레이아웃 ── */
    .app { display:flex; height:100vh; }

    /* ── 사이드바 ── */
    .sidebar { width:220px; min-width:220px; background:var(--surface); border-right:1px solid var(--border); display:flex; flex-direction:column; padding:24px 14px; gap:4px; z-index:50; transition:background .3s,border-color .3s; }
    .sidebar-logo { font-size:.95rem; font-weight:800; background:linear-gradient(135deg,#a78bfa,#60a5fa); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; margin-bottom:24px; padding:0 8px; }
    .nav-label { font-size:.65rem; font-weight:700; color:var(--muted); letter-spacing:.1em; text-transform:uppercase; padding:0 8px; margin:10px 0 4px; }
    .nav-item { display:flex; align-items:center; gap:10px; padding:9px 11px; border-radius:9px; cursor:pointer; transition:background .15s; user-select:none; }
    .nav-item:hover { background:var(--surface2); }
    .nav-item.active { background:rgba(124,58,237,.15); }
    .nav-checkbox { width:17px; height:17px; border:2px solid var(--border2); border-radius:4px; display:flex; align-items:center; justify-content:center; flex-shrink:0; transition:all .2s; font-size:.68rem; color:#fff; }
    .nav-item.active .nav-checkbox { border-color:var(--accent2); background:var(--accent2); box-shadow:0 0 8px rgba(124,58,237,.4); }
    .nav-item-label { font-size:.85rem; font-weight:600; color:var(--muted); transition:color .15s; }
    .nav-item.active .nav-item-label, .nav-item:hover .nav-item-label { color:var(--text); }
    .sidebar-bottom { margin-top:auto; padding:14px 8px 0; border-top:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; }
    .sidebar-info { font-size:.72rem; color:var(--muted); line-height:1.5; }
    .theme-btn { background:var(--surface2); border:1px solid var(--border2); border-radius:8px; padding:6px 10px; font-size:.85rem; cursor:pointer; transition:all .2s; color:var(--text); }
    .theme-btn:hover { border-color:var(--accent); }

    /* ── 메인 ── */
    .main { flex:1; position:relative; overflow:hidden; }

    /* ── 공통 페이지 뷰 ── */
    .page-view { position:absolute; inset:0; display:flex; flex-direction:column; opacity:0; transform:scale(1.02); pointer-events:none; transition:opacity .45s ease,transform .45s ease; }
    .page-view.visible { opacity:1; transform:scale(1); pointer-events:auto; }
    .page-header { display:flex; align-items:center; justify-content:space-between; padding:16px 28px; border-bottom:1px solid var(--border); background:var(--bg); flex-shrink:0; }
    .page-title { font-size:1.1rem; font-weight:800; }
    .page-body { flex:1; overflow-y:auto; padding:28px; }

    /* ── 랜딩 ── */
    .landing { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:40px; transition:opacity .5s,transform .5s; }
    .landing.hidden { opacity:0; transform:scale(.97); pointer-events:none; }
    .orb { position:absolute; border-radius:50%; filter:blur(80px); opacity:.15; pointer-events:none; }
    .orb1 { width:500px; height:500px; background:#7c3aed; top:-150px; right:-100px; }
    .orb2 { width:400px; height:400px; background:#2563eb; bottom:-100px; left:-80px; }
    .orb3 { width:280px; height:280px; background:#a78bfa; top:40%; left:30%; }
    .landing-badge { display:inline-flex; align-items:center; gap:8px; background:rgba(167,139,250,.1); border:1px solid rgba(167,139,250,.25); border-radius:20px; padding:6px 16px; font-size:.8rem; color:var(--accent); font-weight:600; margin-bottom:26px; }
    .landing-title { font-size:clamp(2rem,5vw,3.5rem); font-weight:900; line-height:1.15; margin-bottom:18px; letter-spacing:-.02em; }
    .landing-title .hl { background:linear-gradient(135deg,#a78bfa 0%,#60a5fa 50%,#34d399 100%); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
    .landing-sub { font-size:1rem; color:var(--muted); max-width:460px; line-height:1.75; margin-bottom:44px; }
    .landing-cta { display:flex; gap:14px; flex-wrap:wrap; justify-content:center; }
    .btn-cta { padding:13px 30px; border-radius:12px; font-size:.92rem; font-weight:700; cursor:pointer; border:none; transition:all .2s; }
    .btn-cta-primary { background:linear-gradient(135deg,#7c3aed,#6d28d9); color:#fff; box-shadow:0 6px 24px rgba(124,58,237,.4); }
    .btn-cta-primary:hover { transform:translateY(-2px); box-shadow:0 10px 32px rgba(124,58,237,.55); }
    .btn-cta-outline { background:transparent; color:var(--accent); border:1.5px solid rgba(167,139,250,.4); }
    .btn-cta-outline:hover { background:rgba(167,139,250,.08); border-color:var(--accent); transform:translateY(-2px); }
    .landing-hint { position:absolute; bottom:28px; left:50%; transform:translateX(-50%); font-size:.78rem; color:var(--muted); animation:bounce 2s infinite; }
    @keyframes bounce { 0%,100%{transform:translateX(-50%) translateY(0)} 50%{transform:translateX(-50%) translateY(-6px)} }

    /* ── 포트폴리오 캐러셀 ── */
    .pf-topbar { display:flex; align-items:center; justify-content:space-between; padding:13px 26px; border-bottom:1px solid var(--border); background:var(--bg); flex-shrink:0; }
    .year-tabs { display:flex; gap:3px; background:var(--surface2); border:1px solid var(--border2); border-radius:9px; padding:3px; }
    .year-tab { padding:5px 14px; border-radius:7px; font-size:.8rem; font-weight:600; cursor:pointer; color:var(--muted); border:none; background:transparent; transition:all .2s; }
    .year-tab.active { background:var(--accent2); color:#fff; }
    .scene { flex:1; perspective:1400px; display:flex; align-items:center; justify-content:center; position:relative; overflow:hidden; }
    .carousel-track { position:relative; width:100%; height:100%; transform-style:preserve-3d; }
    .month-card { position:absolute; width:310px; min-height:390px; background:var(--surface); border:1px solid var(--border); border-radius:20px; padding:24px; top:50%; left:50%; margin-left:-155px; margin-top:-195px; transition:transform .45s cubic-bezier(.25,.46,.45,.94),opacity .45s,box-shadow .45s; will-change:transform,opacity; overflow:hidden; }
    .month-card.active-card { border-color:var(--accent2); box-shadow:0 0 0 1px var(--accent2),0 20px 50px rgba(124,58,237,.28); }
    .card-header { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:16px; }
    .card-year-label { font-size:.68rem; font-weight:700; color:var(--accent); letter-spacing:.1em; text-transform:uppercase; margin-bottom:3px; }
    .card-month-label { font-size:1.45rem; font-weight:800; }
    .card-count { background:rgba(167,139,250,.15); color:var(--accent); border-radius:20px; padding:3px 10px; font-size:.73rem; font-weight:700; }
    .card-activities { display:flex; flex-direction:column; gap:7px; }
    .card-activity-item { background:var(--bg); border:1px solid var(--border2); border-radius:9px; padding:8px 11px; display:flex; align-items:center; gap:8px; }
    .mini-tag { font-size:.63rem; font-weight:700; padding:2px 7px; border-radius:20px; flex-shrink:0; }
    .cat-공모전{background:rgba(251,191,36,.15);color:var(--yellow)}
    .cat-자격증{background:rgba(52,211,153,.15);color:var(--green)}
    .cat-프로젝트{background:rgba(167,139,250,.15);color:var(--accent)}
    .cat-학회동아리{background:rgba(96,165,250,.15);color:var(--blue)}
    .cat-인턴{background:rgba(251,146,60,.15);color:var(--orange)}
    .cat-수상{background:rgba(248,113,113,.15);color:var(--red)}
    .cat-기타{background:rgba(107,107,136,.15);color:var(--muted)}
    .card-activity-title { font-size:.82rem; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .card-empty { color:var(--muted); font-size:.82rem; text-align:center; padding:26px 0; line-height:1.7; }
    .card-add-btn { display:flex; align-items:center; justify-content:center; gap:6px; width:100%; padding:8px; margin-top:10px; background:rgba(124,58,237,.08); border:1px dashed rgba(124,58,237,.5); border-radius:9px; color:var(--accent); font-size:.82rem; font-weight:600; cursor:pointer; transition:background .2s; }
    .card-add-btn:hover { background:rgba(124,58,237,.18); }
    .nav-arrow { position:absolute; top:50%; transform:translateY(-50%); background:var(--surface2); border:1px solid var(--border2); color:var(--muted); width:44px; height:44px; border-radius:50%; font-size:1rem; cursor:pointer; z-index:10; display:flex; align-items:center; justify-content:center; transition:all .2s; }
    .nav-arrow:hover { border-color:var(--accent); color:var(--accent); }
    .nav-left{left:18px} .nav-right{right:18px}
    .indicator { position:absolute; bottom:18px; left:50%; transform:translateX(-50%); display:flex; gap:4px; z-index:10; }
    .dot { width:5px; height:5px; border-radius:50%; background:var(--border2); transition:all .3s; cursor:pointer; }
    .dot.active { background:var(--accent); width:17px; border-radius:3px; }
    .dot.has-data { background:var(--muted); }
    .wheel-hint { position:absolute; top:14px; left:50%; transform:translateX(-50%); font-size:.72rem; color:var(--muted); background:var(--surface2); border:1px solid var(--border2); border-radius:20px; padding:4px 13px; pointer-events:none; white-space:nowrap; }

    /* ── 공모전 캘린더 ── */
    .contest-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:14px; }
    .contest-card { background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:20px; display:flex; flex-direction:column; gap:10px; transition:border-color .2s,transform .2s; }
    .contest-card:hover { border-color:var(--border2); transform:translateY(-2px); }
    .contest-top { display:flex; align-items:center; justify-content:space-between; }
    .dday-badge { font-size:.75rem; font-weight:800; padding:4px 12px; border-radius:20px; }
    .dday-urgent { background:rgba(248,113,113,.15); color:var(--red); }
    .dday-soon { background:rgba(251,191,36,.15); color:var(--yellow); }
    .dday-ok { background:rgba(52,211,153,.15); color:var(--green); }
    .dday-done { background:rgba(107,107,136,.15); color:var(--muted); }
    .contest-name { font-size:.98rem; font-weight:700; }
    .contest-deadline { font-size:.8rem; color:var(--muted); }
    .contest-actions { display:flex; gap:6px; justify-content:flex-end; margin-top:4px; }
    .add-btn { display:flex; align-items:center; gap:7px; background:var(--accent2); color:#fff; border:none; padding:9px 20px; border-radius:9px; font-size:.85rem; font-weight:700; cursor:pointer; transition:opacity .2s; margin-bottom:18px; }
    .add-btn:hover { opacity:.85; }
    .empty-state { text-align:center; padding:60px 20px; color:var(--muted); }
    .empty-state .ei { font-size:2.8rem; margin-bottom:12px; }

    /* ── 스킬 트리 ── */
    .skill-cat-tabs { display:flex; gap:7px; flex-wrap:wrap; margin-bottom:20px; }
    .skill-cat-tab { padding:6px 14px; border-radius:20px; font-size:.8rem; font-weight:600; cursor:pointer; border:1px solid var(--border2); background:transparent; color:var(--muted); transition:all .15s; }
    .skill-cat-tab.active { background:var(--accent2); color:#fff; border-color:var(--accent2); }
    .skill-cat-tab:hover { border-color:var(--accent); color:var(--text); }
    .skill-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:12px; }
    .skill-card { background:var(--surface); border:1px solid var(--border); border-radius:13px; padding:18px; display:flex; flex-direction:column; gap:8px; transition:border-color .2s; }
    .skill-card:hover { border-color:var(--border2); }
    .skill-name { font-size:.95rem; font-weight:700; }
    .skill-cat-label { font-size:.7rem; font-weight:700; color:var(--accent); }
    .skill-stars { display:flex; gap:3px; }
    .star { font-size:1rem; }
    .star.on { color:var(--yellow); }
    .star.off { color:var(--border2); }
    .skill-actions { display:flex; gap:5px; margin-top:4px; }

    /* ── 성장 타임라인 ── */
    .timeline-filter { display:flex; gap:7px; flex-wrap:wrap; margin-bottom:22px; }
    .tl-filter-btn { padding:5px 13px; border-radius:20px; font-size:.78rem; font-weight:600; cursor:pointer; border:1px solid var(--border2); background:transparent; color:var(--muted); transition:all .15s; }
    .tl-filter-btn.active { background:var(--accent2); color:#fff; border-color:var(--accent2); }
    .timeline-wrap { position:relative; padding-left:28px; }
    .timeline-wrap::before { content:''; position:absolute; left:8px; top:0; bottom:0; width:2px; background:var(--border2); border-radius:2px; }
    .tl-year { font-size:1.1rem; font-weight:800; color:var(--accent); margin:24px 0 14px; position:relative; }
    .tl-year::before { content:''; position:absolute; left:-24px; top:50%; transform:translateY(-50%); width:10px; height:10px; border-radius:50%; background:var(--accent2); box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--accent2); }
    .tl-month-group { margin-bottom:18px; }
    .tl-month-label { font-size:.82rem; font-weight:700; color:var(--muted); margin-bottom:8px; position:relative; }
    .tl-month-label::before { content:''; position:absolute; left:-24px; top:50%; transform:translateY(-50%); width:6px; height:6px; border-radius:50%; background:var(--border2); }
    .tl-activity { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:11px 14px; margin-bottom:7px; display:flex; align-items:center; gap:10px; transition:border-color .2s; }
    .tl-activity:hover { border-color:var(--border2); }
    .tl-activity-info { flex:1; }
    .tl-activity-title { font-size:.88rem; font-weight:700; margin-bottom:2px; }
    .tl-activity-desc { font-size:.78rem; color:var(--muted); }

    /* ── 모달 ── */
    .modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.65); z-index:500; align-items:center; justify-content:center; backdrop-filter:blur(6px); }
    .modal-overlay.open { display:flex; }
    .modal { background:var(--surface); border:1px solid var(--border2); border-radius:20px; padding:28px; width:90%; max-width:480px; max-height:85vh; overflow-y:auto; }
    .modal h2 { font-size:1.08rem; font-weight:800; margin-bottom:20px; }
    .form-group { margin-bottom:14px; }
    .form-group label { display:block; font-size:.73rem; font-weight:700; color:var(--muted); margin-bottom:6px; text-transform:uppercase; letter-spacing:.06em; }
    .form-group input,.form-group textarea,.form-group select { width:100%; background:var(--bg); border:1px solid var(--border2); border-radius:9px; padding:10px 12px; color:var(--text); font-size:.9rem; font-family:inherit; outline:none; transition:border-color .2s; }
    .form-group input:focus,.form-group textarea:focus,.form-group select:focus { border-color:var(--accent); }
    .form-group textarea { resize:vertical; min-height:80px; }
    .form-group select option { background:var(--surface2); }
    .cat-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; }
    .cat-btn { padding:8px 4px; border-radius:8px; border:1px solid var(--border2); background:var(--bg); color:var(--muted); font-size:.73rem; font-weight:600; cursor:pointer; text-align:center; transition:all .15s; }
    .cat-btn:hover { border-color:var(--accent); color:var(--text); }
    .cat-btn.selected { border-color:var(--accent); background:rgba(167,139,250,.15); color:var(--accent); }
    .star-picker { display:flex; gap:6px; }
    .star-pick { font-size:1.4rem; cursor:pointer; transition:transform .15s; filter:grayscale(1) opacity(.4); }
    .star-pick.on { filter:none; }
    .star-pick:hover { transform:scale(1.2); }
    .modal-actions { display:flex; gap:9px; margin-top:18px; }
    .btn-save { flex:1; background:linear-gradient(135deg,var(--accent2),#6d28d9); color:#fff; border:none; padding:11px; border-radius:9px; font-size:.9rem; font-weight:700; cursor:pointer; transition:opacity .2s; }
    .btn-save:hover { opacity:.85; }
    .btn-cancel { background:var(--border); color:var(--muted); border:none; padding:11px 16px; border-radius:9px; font-size:.9rem; cursor:pointer; transition:background .15s; }
    .btn-cancel:hover { background:var(--border2); }
    .btn-sm { padding:6px 13px; border-radius:7px; font-size:.75rem; font-weight:600; cursor:pointer; border:none; transition:all .2s; }
    .btn-icon { background:var(--border); border:none; border-radius:7px; padding:5px 9px; font-size:.72rem; color:var(--muted); cursor:pointer; transition:all .15s; }
    .btn-icon:hover { background:var(--border2); color:var(--text); }
    .btn-icon.del:hover { background:rgba(248,113,113,.15); color:var(--red); }
    .btn-outline-sm { background:transparent; border:1px solid var(--border2); color:var(--muted); }
    .btn-outline-sm:hover { border-color:var(--accent); color:var(--accent); }

    /* 상세 모달 */
    .detail-modal { background:var(--surface); border:1px solid var(--border2); border-radius:20px; padding:28px; width:90%; max-width:520px; max-height:85vh; overflow-y:auto; }
    .detail-modal h2 { font-size:1.15rem; font-weight:800; margin-bottom:4px; }
    .detail-sub { color:var(--muted); font-size:.82rem; margin-bottom:20px; }
    .activity-row { background:var(--bg); border:1px solid var(--border2); border-radius:10px; padding:12px 14px; margin-bottom:8px; display:flex; align-items:flex-start; justify-content:space-between; gap:11px; }
    .activity-row-body { flex:1; }
    .activity-row-title { font-size:.9rem; font-weight:700; margin-bottom:3px; }
    .activity-row-desc { font-size:.8rem; color:var(--muted); line-height:1.55; white-space:pre-wrap; }
    .activity-row-actions { display:flex; gap:5px; flex-shrink:0; }

    ::-webkit-scrollbar{width:4px} ::-webkit-scrollbar-track{background:transparent} ::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px}
  </style>
</head>
<body>
<div class="app">

  <!-- 사이드바 -->
  <nav class="sidebar">
    <div class="sidebar-logo">커리어 다이어리</div>
    <div class="nav-label">메뉴</div>
    <div class="nav-item active" id="nav-home" onclick="showPage('home')">
      <div class="nav-checkbox" id="chk-home">✓</div>
      <span>🏠</span><span class="nav-item-label">홈</span>
    </div>
    <div class="nav-item" id="nav-portfolio" onclick="showPage('portfolio')">
      <div class="nav-checkbox" id="chk-portfolio"></div>
      <span>📋</span><span class="nav-item-label">포트폴리오 작성</span>
    </div>
    <div class="nav-item" id="nav-calendar" onclick="showPage('calendar')">
      <div class="nav-checkbox" id="chk-calendar"></div>
      <span>🏆</span><span class="nav-item-label">공모전 캘린더</span>
    </div>
    <div class="nav-item" id="nav-skilltree" onclick="showPage('skilltree')">
      <div class="nav-checkbox" id="chk-skilltree"></div>
      <span>🌳</span><span class="nav-item-label">스킬 트리</span>
    </div>
    <div class="nav-item" id="nav-timeline" onclick="showPage('timeline')">
      <div class="nav-checkbox" id="chk-timeline"></div>
      <span>📈</span><span class="nav-item-label">성장 타임라인</span>
    </div>
    <div class="nav-item" id="nav-export" onclick="exportPortfolio()">
      <div class="nav-checkbox" id="chk-export"></div>
      <span>📤</span><span class="nav-item-label">내보내기</span>
    </div>
    <div class="sidebar-bottom">
      <div class="sidebar-info">전기전자공학부<br/>1학년 맞춤형</div>
      <button class="theme-btn" id="themeBtn" onclick="toggleTheme()">🌙</button>
    </div>
  </nav>

  <!-- 메인 -->
  <div class="main">

    <!-- 랜딩 -->
    <div class="landing" id="landingPage">
      <div class="orb orb1"></div><div class="orb orb2"></div><div class="orb orb3"></div>
      <div class="landing-badge">✦ 전기전자공학부 1학년을 위한</div>
      <h1 class="landing-title"><span class="hl">1학년 맞춤</span><br/>포트폴리오 제작소</h1>
      <p class="landing-sub">대학 4년을 월별로 기록하고,<br/>나만의 커리어 포트폴리오를 완성하세요.</p>
      <div class="landing-cta">
        <button class="btn-cta btn-cta-primary" onclick="showPage('portfolio')">포트폴리오 작성 시작하기 →</button>
        <button class="btn-cta btn-cta-outline" onclick="showPage('timeline')">성장 타임라인 보기</button>
      </div>
      <div class="landing-hint">↑ 왼쪽 메뉴에서 원하는 기능을 선택하세요</div>
    </div>

    <!-- 포트폴리오 캐러셀 -->
    <div class="page-view" id="portfolioView" style="flex-direction:column;">
      <div class="pf-topbar">
        <div class="year-tabs" id="yearTabs">
          <button class="year-tab active" data-year="1" onclick="jumpToYear(1)">1학년</button>
          <button class="year-tab" data-year="2" onclick="jumpToYear(2)">2학년</button>
          <button class="year-tab" data-year="3" onclick="jumpToYear(3)">3학년</button>
          <button class="year-tab" data-year="4" onclick="jumpToYear(4)">4학년</button>
        </div>
        <button class="btn-sm btn-outline-sm" onclick="openDetailModal()">📋 목록 보기</button>
      </div>
      <div class="scene" id="scene">
        <div class="carousel-track" id="track"></div>
        <button class="nav-arrow nav-left" onclick="move(-1)">←</button>
        <button class="nav-arrow nav-right" onclick="move(1)">→</button>
        <div class="indicator" id="indicator"></div>
        <div class="wheel-hint">🖱️ 마우스 휠 또는 ← → 버튼으로 넘기기</div>
      </div>
    </div>

    <!-- 공모전 캘린더 -->
    <div class="page-view" id="calendarView">
      <div class="page-header">
        <div class="page-title">🏆 공모전 캘린더</div>
      </div>
      <div class="page-body">
        <button class="add-btn" onclick="openContestModal()">+ 공모전 추가</button>
        <div class="contest-grid" id="contestGrid"></div>
      </div>
    </div>

    <!-- 스킬 트리 -->
    <div class="page-view" id="skilltreeView">
      <div class="page-header">
        <div class="page-title">🌳 스킬 트리</div>
      </div>
      <div class="page-body">
        <button class="add-btn" onclick="openSkillModal()">+ 스킬 추가</button>
        <div class="skill-cat-tabs" id="skillCatTabs"></div>
        <div class="skill-grid" id="skillGrid"></div>
      </div>
    </div>

    <!-- 성장 타임라인 -->
    <div class="page-view" id="timelineView">
      <div class="page-header">
        <div class="page-title">📈 성장 타임라인</div>
      </div>
      <div class="page-body">
        <div class="timeline-filter" id="tlFilter"></div>
        <div class="timeline-wrap" id="timelineWrap"></div>
      </div>
    </div>

  </div>
</div>

<!-- 포트폴리오 활동 추가 모달 -->
<div class="modal-overlay" id="addModal">
  <div class="modal">
    <h2 id="modalTitle">활동 추가</h2>
    <div class="form-group">
      <label>카테고리</label>

<div class="modal-overlay" id="detailModal">

    <div class="form-group"><label>공모전 이름</label><input type="text" id="contestName" placeholder="예) KIT 전자공학 설계 공모전"/></div>

<!-- 스킬 추가 모달 -->
<div class="modal-overlay" id="skillModal">
  <div class="modal">
    <h2 id="skillModalTitle">스킬 추가</h2>
    <div class="form-group"><label>스킬 이름</label><input type="text" id="skillName" placeholder="예) Python, 아두이노, TOEIC ..."/></div>
    <div class="form-group">
      <label>카테고리</label>
      <select id="skillCat">
        <option value="프로그래밍">💻 프로그래밍</option>
        <option value="하드웨어">🔧 하드웨어</option>
        <option value="어학">🌐 어학</option>
        <option value="수학/이론">📐 수학/이론</option>
        <option value="툴/소프트웨어">🛠️ 툴/소프트웨어</option>

        <span class="star-pick" data-v="2" onclick="setStars(2)">⭐</span>
        <span class="star-pick" data-v="3" onclick="setStars(3)">⭐</span>
        <span class="star-pick" data-v="4" onclick="setStars(4)">⭐</span>
        <span class="star-pick" data-v="5" onclick="setStars(5)">⭐</span>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeSkillModal()">취소</button>
      <button class="btn-save" onclick="saveSkill()">저장하기</button>
    </div>
  </div>
</div>

<script>
  // ── 상수 ──────────────────────────────────────────
  const TOTAL=48, SPREAD=420, DEPTH=260, ROT_Y=40;
  const MONTH_NAMES=['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
  const YEAR_LABELS=['1학년','2학년','3학년','4학년'];
  const CATS=['전체','공모전','자격증','프로젝트','학회동아리','인턴','수상','기타'];
  const SKILL_CATS=['전체','프로그래밍','하드웨어','어학','수학/이론','툴/소프트웨어','기타'];

  let current=0, selectedCat='공모전', editingId=null, addingKey=null;
  let contestEditId=null, skillEditId=null, skillStars=1;
  let activeTlFilter='전체', activeSkillFilter='전체';

  // ── 데이터 ────────────────────────────────────────
  const key=i=>`${Math.floor(i/12)+1}-${i%12+1}`;
  const load=()=>JSON.parse(localStorage.getItem('careerDiary')||'{}');
  const save=d=>localStorage.setItem('careerDiary',JSON.stringify(d));
  const loadC=()=>JSON.parse(localStorage.getItem('contests')||'[]');
  const saveC=d=>localStorage.setItem('contests',JSON.stringify(d));
  const loadS=()=>JSON.parse(localStorage.getItem('skills')||'[]');
  const saveS=d=>localStorage.setItem('skills',JSON.stringify(d));

  // ── 다크/라이트 모드 ──────────────────────────────
  let isLight = localStorage.getItem('theme')==='light';
  function applyTheme(){
    document.body.classList.toggle('light',isLight);
    document.getElementById('themeBtn').textContent=isLight?'🌙':'☀️';
  }
  function toggleTheme(){
    isLight=!isLight;
    localStorage.setItem('theme',isLight?'light':'dark');
    applyTheme();
  }
  applyTheme();

  // ── 페이지 전환 ───────────────────────────────────
  const PAGES=['home','portfolio','calendar','skilltree','timeline','export'];
  function showPage(page){
    PAGES.forEach(p=>{
      const item=document.getElementById(`nav-${p}`);
      const chk=document.getElementById(`chk-${p}`);
      if(!item||!chk) return;
      item.classList.toggle('active',p===page);
      chk.textContent=p===page?'✓':'';
    });
    document.getElementById('landingPage').classList.toggle('hidden',page!=='home');
    ['portfolio','calendar','skilltree','timeline'].forEach(v=>{
      document.getElementById(`${v}View`).classList.toggle('visible',v===page);
    });
    if(page==='portfolio') updateCarousel();
    if(page==='calendar')  renderCalendar();
    if(page==='skilltree') renderSkillTree();
    if(page==='timeline')  renderTimeline();
  }

  // ── 포트폴리오 캐러셀 ─────────────────────────────
  function buildCards(){
    const t=document.getElementById('track');
    t.innerHTML='';
    for(let i=0;i<TOTAL;i++){
      const d=document.createElement('div');
      d.className='month-card'; d.id=`card-${i}`;
      d.onclick=()=>{if(i!==current){current=i;updateCarousel();}};
      t.appendChild(d);
    }
    buildIndicator(); updateCarousel();
  }
  function updateCarousel(){
    const data=load();
    for(let i=0;i<TOTAL;i++){
      const card=document.getElementById(`card-${i}`);
      const off=i-current, abs=Math.abs(off);
      if(abs>4){card.style.opacity='0';card.style.pointerEvents='none';card.style.transform=`translateX(${off*SPREAD}px) translateZ(-600px) rotateY(${off>0?ROT_Y:-ROT_Y}deg) scale(0.4)`;continue;}
      const sc=off===0?1:Math.max(.55,1-abs*.13), op=off===0?1:Math.max(.25,1-abs*.22);
      card.style.transform=`translateX(${off*SPREAD}px) translateZ(${-abs*DEPTH}px) rotateY(${off===0?0:off>0?ROT_Y:-ROT_Y}deg) scale(${sc})`;
      card.style.opacity=op; card.style.pointerEvents=off===0?'auto':'none'; card.style.zIndex=100-abs;
      card.classList.toggle('active-card',off===0); renderCard(i,card,data);
    }
    updateYearTabs(); updateIndicator();
  }
  function renderCard(i,card,data){
    const year=Math.floor(i/12)+1, month=i%12+1, k=key(i), acts=data[k]||[];
    const preview=acts.slice(0,3).map(a=>`<div class="card-activity-item"><span class="mini-tag cat-${a.category}">${a.category}</span><span class="card-activity-title">${esc(a.title)}</span></div>`).join('');
    const more=acts.length>3?`<div style="font-size:.72rem;color:var(--muted);margin-top:4px;text-align:right;">+${acts.length-3}개 더</div>`:'';
    const empty=acts.length===0?`<div class="card-empty">아직 기록된 활동이 없어요<br/><span style="font-size:1.2rem">✏️</span></div>`:'';
    const btn=i===current?`<button class="card-add-btn" onclick="openAddModal('${k}')">+ 활동 추가</button>`:'';
    card.innerHTML=`<div class="card-header"><div><div class="card-year-label">${YEAR_LABELS[year-1]}</div><div class="card-month-label">${year}-${month} ${MONTH_NAMES[month-1]}</div></div>${acts.length>0?`<span class="card-count">${acts.length}개</span>`:''}</div><div class="card-activities">${preview}${empty}${more}</div>${btn}`;
  }
  function buildIndicator(){
    const el=document.getElementById('indicator'); el.innerHTML='';
    for(let i=0;i<TOTAL;i++){const d=document.createElement('div');d.className='dot';d.onclick=()=>{current=i;updateCarousel();};el.appendChild(d);}
  }
  function updateIndicator(){
    const data=load();
    document.querySelectorAll('.dot').forEach((d,i)=>{d.classList.toggle('active',i===current);d.classList.toggle('has-data',(data[key(i)]||[]).length>0&&i!==current);});
  }
  function updateYearTabs(){
    const y=Math.floor(current/12)+1;
    document.querySelectorAll('.year-tab').forEach(t=>t.classList.toggle('active',parseInt(t.dataset.year)===y));
  }
  function jumpToYear(y){current=(y-1)*12;updateCarousel();}
  function move(dir){const n=current+dir;if(n<0||n>=TOTAL)return;current=n;updateCarousel();}
  let wheelLock=false;
  document.getElementById('scene').addEventListener('wheel',e=>{e.preventDefault();if(wheelLock)return;wheelLock=true;move(e.deltaY>0?1:-1);setTimeout(()=>wheelLock=false,400);},{passive:false});
  document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')move(-1);if(e.key==='ArrowRight')move(1);});

  // ── 포트폴리오 활동 모달 ──────────────────────────
  function openAddModal(k,editId=null){
    addingKey=k; editingId=editId; const data=load();
    if(editId!==null){const act=(data[k]||[]).find(a=>a.id===editId);if(act){document.getElementById('modalTitle').textContent='활동 수정';document.getElementById('inputTitle').value=act.title;document.getElementById('inputDesc').value=act.desc;selectCatByName(act.category);}}
    else{document.getElementById('modalTitle').textContent='활동 추가';document.getElementById('inputTitle').value='';document.getElementById('inputDesc').value='';selectCatByName('공모전');}
    document.getElementById('addModal').classList.add('open');
    setTimeout(()=>document.getElementById('inputTitle').focus(),100);
  }
  function closeAddModal(){document.getElementById('addModal').classList.remove('open');editingId=null;addingKey=null;}
  function selectCat(btn){document.querySelectorAll('.cat-btn').forEach(b=>b.classList.remove('selected'));btn.classList.add('selected');selectedCat=btn.dataset.cat;}
  function selectCatByName(name){document.querySelectorAll('.cat-btn').forEach(b=>b.classList.toggle('selected',b.dataset.cat===name));selectedCat=name;}
  function saveActivity(){
    const title=document.getElementById('inputTitle').value.trim(), desc=document.getElementById('inputDesc').value.trim();
    if(!title){const el=document.getElementById('inputTitle');el.style.borderColor='var(--red)';el.focus();setTimeout(()=>el.style.borderColor='',1200);return;}
    const data=load(); if(!data[addingKey])data[addingKey]=[];
    if(editingId!==null){const idx=data[addingKey].findIndex(a=>a.id===editingId);if(idx!==-1)data[addingKey][idx]={...data[addingKey][idx],title,desc,category:selectedCat};}
    else data[addingKey].push({id:Date.now(),title,desc,category:selectedCat});
    save(data); closeAddModal(); updateCarousel();
  }
  function openDetailModal(){
    const k=key(current), year=Math.floor(current/12)+1, month=current%12+1;
    const acts=(load()[k]||[]);
    document.getElementById('detailTitle').textContent=`${YEAR_LABELS[year-1]} ${month}월`;
    document.getElementById('detailSub').textContent=`${year}-${month} 활동 목록`;
    const list=document.getElementById('detailList');
    list.innerHTML=acts.length===0?`<div style="text-align:center;padding:36px;color:var(--muted)">아직 활동이 없어요!</div>`:acts.map(a=>`<div class="activity-row"><div class="activity-row-body"><span class="mini-tag cat-${a.category}" style="margin-bottom:5px;display:inline-block">${a.category}</span><div class="activity-row-title">${esc(a.title)}</div><div class="activity-row-desc">${esc(a.desc)}</div></div><div class="activity-row-actions"><button class="btn-icon" onclick="editFromDetail('${k}',${a.id})">수정</button><button class="btn-icon del" onclick="deleteActivity('${k}',${a.id})">삭제</button></div></div>`).join('');
    list.innerHTML+=`<button class="card-add-btn" style="margin-top:6px" onclick="closeDetailModal();openAddModal('${k}')">+ 활동 추가</button>`;
    document.getElementById('detailModal').classList.add('open');
  }
  function closeDetailModal(){document.getElementById('detailModal').classList.remove('open');}
  function editFromDetail(k,id){closeDetailModal();openAddModal(k,id);}
  function deleteActivity(k,id){
    if(!confirm('이 활동을 삭제할까요?'))return;
    const data=load(); data[k]=(data[k]||[]).filter(a=>a.id!==id); save(data); updateCarousel();
    if(document.getElementById('detailModal').classList.contains('open'))openDetailModal();
  }

  // ── 공모전 캘린더 ─────────────────────────────────
  function getDday(deadline){
    const today=new Date(); today.setHours(0,0,0,0);
    const target=new Date(deadline); target.setHours(0,0,0,0);
    return Math.floor((target-today)/(1000*60*60*24));
  }
  function ddayLabel(d){
    if(d<0) return{text:'마감',cls:'dday-done'};
    if(d===0) return{text:'D-Day',cls:'dday-urgent'};
    if(d<=7) return{text:`D-${d}`,cls:'dday-urgent'};
    if(d<=30) return{text:`D-${d}`,cls:'dday-soon'};
    return{text:`D-${d}`,cls:'dday-ok'};
  }
  function renderCalendar(){
    const contests=loadC().sort((a,b)=>getDday(a.deadline)-getDday(b.deadline));
    const el=document.getElementById('contestGrid');
    if(contests.length===0){el.innerHTML=`<div class="empty-state"><div class="ei">🏆</div><p>등록된 공모전이 없어요.<br/>+ 버튼으로 공모전을 추가해보세요!</p></div>`;return;}
    el.innerHTML=contests.map(c=>{
      const d=getDday(c.deadline), {text,cls}=ddayLabel(d);
      const dateStr=new Date(c.deadline).toLocaleDateString('ko-KR');
      return`<div class="contest-card"><div class="contest-top"><span class="dday-badge ${cls}">${text}</span><span class="mini-tag cat-${c.category==='공모전'?'공모전':c.category==='장학금'?'자격증':c.category==='인턴'?'인턴':'기타'}">${c.category}</span></div><div class="contest-name">${esc(c.name)}</div><div class="contest-deadline">📅 마감일 ${dateStr}</div><div class="contest-actions"><button class="btn-icon" onclick="openContestModal(${c.id})">수정</button><button class="btn-icon del" onclick="deleteContest(${c.id})">삭제</button></div></div>`;
    }).join('');
  }
  function openContestModal(id=null){
    contestEditId=id;
    if(id!==null){const c=loadC().find(x=>x.id===id);if(c){document.getElementById('contestModalTitle').textContent='공모전 수정';document.getElementById('contestName').value=c.name;document.getElementById('contestDeadline').value=c.deadline;document.getElementById('contestCat').value=c.category;}}
    else{document.getElementById('contestModalTitle').textContent='공모전 추가';document.getElementById('contestName').value='';document.getElementById('contestDeadline').value='';document.getElementById('contestCat').value='공모전';}
    document.getElementById('contestModal').classList.add('open');
    setTimeout(()=>document.getElementById('contestName').focus(),100);
  }
  function closeContestModal(){document.getElementById('contestModal').classList.remove('open');contestEditId=null;}
  function saveContest(){
    const name=document.getElementById('contestName').value.trim(), deadline=document.getElementById('contestDeadline').value, category=document.getElementById('contestCat').value;
    if(!name||!deadline){alert('이름과 마감일을 입력해주세요.');return;}
    const data=loadC();
    if(contestEditId!==null){const idx=data.findIndex(x=>x.id===contestEditId);if(idx!==-1)data[idx]={...data[idx],name,deadline,category};}
    else data.push({id:Date.now(),name,deadline,category});
    saveC(data); closeContestModal(); renderCalendar();
  }
  function deleteContest(id){if(!confirm('삭제할까요?'))return;saveC(loadC().filter(x=>x.id!==id));renderCalendar();}

  // ── 스킬 트리 ─────────────────────────────────────
  function renderSkillTree(){
    const skills=loadS();
    // 카테고리 탭
    const tabs=document.getElementById('skillCatTabs');
    tabs.innerHTML=SKILL_CATS.map(c=>`<button class="skill-cat-tab${c===activeSkillFilter?' active':''}" onclick="filterSkills('${c}')">${c}</button>`).join('');
    // 스킬 카드
    const filtered=activeSkillFilter==='전체'?skills:skills.filter(s=>s.category===activeSkillFilter);
    const grid=document.getElementById('skillGrid');
    if(filtered.length===0){grid.innerHTML=`<div class="empty-state" style="grid-column:1/-1"><div class="ei">🌱</div><p>아직 스킬이 없어요.<br/>+ 버튼으로 스킬을 추가해보세요!</p></div>`;return;}
    grid.innerHTML=filtered.map(s=>{
      const stars=Array.from({length:5},(_,i)=>`<span class="star ${i<s.level?'on':'off'}">⭐</span>`).join('');
      return`<div class="skill-card"><div class="skill-cat-label">${s.category}</div><div class="skill-name">${esc(s.name)}</div><div class="skill-stars">${stars}</div><div class="skill-actions"><button class="btn-icon" onclick="openSkillModal(${s.id})">수정</button><button class="btn-icon del" onclick="deleteSkill(${s.id})">삭제</button></div></div>`;
    }).join('');
  }
  function filterSkills(cat){activeSkillFilter=cat;renderSkillTree();}
  function setStars(v){
    skillStars=v;
    document.querySelectorAll('.star-pick').forEach(s=>s.classList.toggle('on',parseInt(s.dataset.v)<=v));
  }
  function openSkillModal(id=null){
    skillEditId=id;
    if(id!==null){const s=loadS().find(x=>x.id===id);if(s){document.getElementById('skillModalTitle').textContent='스킬 수정';document.getElementById('skillName').value=s.name;document.getElementById('skillCat').value=s.category;setStars(s.level);}}
    else{document.getElementById('skillModalTitle').textContent='스킬 추가';document.getElementById('skillName').value='';document.getElementById('skillCat').value='프로그래밍';setStars(1);}
    document.getElementById('skillModal').classList.add('open');
    setTimeout(()=>document.getElementById('skillName').focus(),100);
  }
  function closeSkillModal(){document.getElementById('skillModal').classList.remove('open');skillEditId=null;}
  function saveSkill(){
    const name=document.getElementById('skillName').value.trim(), category=document.getElementById('skillCat').value;
    if(!name){const el=document.getElementById('skillName');el.style.borderColor='var(--red)';el.focus();setTimeout(()=>el.style.borderColor='',1200);return;}
    const data=loadS();
    if(skillEditId!==null){const idx=data.findIndex(x=>x.id===skillEditId);if(idx!==-1)data[idx]={...data[idx],name,category,level:skillStars};}
    else data.push({id:Date.now(),name,category,level:skillStars});
    saveS(data); closeSkillModal(); renderSkillTree();
  }
  function deleteSkill(id){if(!confirm('삭제할까요?'))return;saveS(loadS().filter(x=>x.id!==id));renderSkillTree();}

  // ── 성장 타임라인 ─────────────────────────────────
  function renderTimeline(){
    const data=load();
    // 필터 버튼
    document.getElementById('tlFilter').innerHTML=CATS.map(c=>`<button class="tl-filter-btn${c===activeTlFilter?' active':''}" onclick="filterTimeline('${c}')">${c}</button>`).join('');
    // 모든 활동 수집
    const all=[];
    for(let y=1;y<=4;y++) for(let m=1;m<=12;m++){
      const k=`${y}-${m}`, acts=(data[k]||[]);
      if(acts.length>0) all.push({year:y,month:m,acts});
    }
    const filtered=all.map(({year,month,acts})=>({year,month,acts:activeTlFilter==='전체'?acts:acts.filter(a=>a.category===activeTlFilter)})).filter(x=>x.acts.length>0);
    const wrap=document.getElementById('timelineWrap');
    if(filtered.length===0){wrap.innerHTML=`<div class="empty-state"><div class="ei">📭</div><p>아직 기록된 활동이 없어요.</p></div>`;return;}
    let html='', lastYear=0;
    filtered.forEach(({year,month,acts})=>{
      if(year!==lastYear){html+=`<div class="tl-year">${YEAR_LABELS[year-1]}</div>`;lastYear=year;}
      html+=`<div class="tl-month-group"><div class="tl-month-label">${year}-${month} ${MONTH_NAMES[month-1]}</div>`;
      acts.forEach(a=>{html+=`<div class="tl-activity"><span class="mini-tag cat-${a.category}">${a.category}</span><div class="tl-activity-info"><div class="tl-activity-title">${esc(a.title)}</div>${a.desc?`<div class="tl-activity-desc">${esc(a.desc.substring(0,60))}${a.desc.length>60?'...':''}</div>`:''}</div></div>`;});
      html+='</div>';
    });
    wrap.innerHTML=html;
  }
  function filterTimeline(cat){activeTlFilter=cat;renderTimeline();}

  // ── 내보내기 ──────────────────────────────────────
  function exportPortfolio(){
    const data=load();
    let html=`<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"/><title>커리어 포트폴리오</title><style>body{font-family:'Apple SD Gothic Neo',sans-serif;max-width:820px;margin:40px auto;padding:0 24px;color:#1a1a2e}h1{font-size:2rem;margin-bottom:6px}h2{font-size:1.1rem;margin:28px 0 9px;color:#7c3aed;border-bottom:2px solid #ede9fe;padding-bottom:5px}.tag{display:inline-block;background:#ede9fe;color:#7c3aed;padding:2px 10px;border-radius:20px;font-size:.7rem;margin-bottom:5px;font-weight:700}.card{border:1px solid #e5e7eb;border-radius:10px;padding:13px 17px;margin-bottom:9px}.title{font-weight:700;margin-bottom:3px;font-size:.93rem}p{color:#4b5563;font-size:.85rem;line-height:1.6;margin:0}</style></head><body><h1>📋 커리어 포트폴리오</h1><p style="color:#6b7280;margin-bottom:30px">전기전자공학부 | ${new Date().toLocaleDateString('ko-KR')}</p>`;
    for(let y=1;y<=4;y++){let yc='';for(let m=1;m<=12;m++){const k=`${y}-${m}`,acts=data[k]||[];if(acts.length>0){yc+=`<h2>${y}-${m} ${MONTH_NAMES[m-1]}</h2>`;acts.forEach(a=>{yc+=`<div class="card"><span class="tag">${a.category}</span><div class="title">${a.title}</div><p>${(a.desc||'').replace(/\n/g,'<br/>')}</p></div>`;});}}if(yc)html+=`<h2 style="font-size:1.35rem;color:#1a1a2e;border-bottom:3px solid #7c3aed">${YEAR_LABELS[y-1]}</h2>${yc}`;}
    html+=`</body></html>`;
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([html],{type:'text/html'}));a.download='커리어포트폴리오.html';a.click();
    // 체크 애니메이션
    const item=document.getElementById('nav-export'), chk=document.getElementById('chk-export');
    item.classList.add('active'); chk.textContent='✓';
    setTimeout(()=>{item.classList.remove('active');chk.textContent='';},1200);
  }

  // ── 유틸 ──────────────────────────────────────────
  const esc=s=>(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

  ['addModal','detailModal','contestModal','skillModal'].forEach(id=>{
    document.getElementById(id).addEventListener('click',e=>{
      if(e.target.id===id){{id==='addModal'?closeAddModal():id==='detailModal'?closeDetailModal():id==='contestModal'?closeContestModal():closeSkillModal();}};
    });
  });

  // ── 초기화 ────────────────────────────────────────
  buildCards();
  showPage('home');
</script>
</body>
</html>
